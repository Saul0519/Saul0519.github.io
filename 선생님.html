<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>선생님 바로 알기 — 2026 스승의 날</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:     #F2F4F7;
  --white:  #FFFFFF;
  --bd:     #E2E6EC;
  --bd2:    #CDD3DC;
  --tx:     #1A1E28;
  --tm:     #52596A;
  --td:     #9BA3B4;
  --blue:   #2B5FD9;
  --blue-lt:#EEF2FC;
}

body {
  background: var(--bg);
  color: var(--tx);
  font-family: 'Noto Sans KR', sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ─── HEADER ─── */
header {
  background: var(--white);
  border-bottom: 1px solid var(--bd);
  padding: 32px 40px 28px;
}
header h1 {
  font-size: 20px;
  font-weight: 700;
  color: var(--tx);
  letter-spacing: -0.03em;
  margin-bottom: 4px;
}
header p {
  font-size: 12px;
  color: var(--td);
  font-weight: 300;
}

/* ─── STICKY SEARCH ─── */
.search-wrap {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--white);
  border-bottom: 1px solid var(--bd);
  padding: 14px 40px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.search-box {
  display: flex;
  align-items: center;
  background: var(--bg);
  border: 1.5px solid var(--bd2);
  border-radius: 8px;
  padding: 0 14px;
  max-width: 520px;
  transition: border-color 0.15s;
}
.search-box:focus-within {
  border-color: var(--blue);
  background: var(--white);
}
.search-icon { font-size: 14px; color: var(--td); flex-shrink: 0; }
#si {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  padding: 10px 10px;
  font-size: 14px;
  font-family: 'Noto Sans KR', sans-serif;
  color: var(--tx);
}
#si::placeholder { color: var(--td); }
#clr {
  background: none; border: none; color: var(--td);
  cursor: pointer; font-size: 13px; padding: 4px;
  display: none; transition: color 0.1s;
}
#clr.on { display: block; }
#clr:hover { color: var(--tm); }

.filter-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 10px;
}
.fb {
  background: var(--white);
  border: 1px solid var(--bd);
  color: var(--tm);
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-family: 'Noto Sans KR', sans-serif;
  cursor: pointer;
  transition: all 0.12s;
  font-weight: 400;
}
.fb:hover { border-color: var(--bd2); color: var(--tx); }
.fb.on {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
  font-weight: 500;
}

/* ─── BODY ─── */
.body {
  max-width: 1160px;
  margin: 0 auto;
  padding: 24px 40px 80px;
}

.result-bar {
  font-size: 12px;
  color: var(--td);
  margin-bottom: 16px;
}
.result-bar strong { color: var(--blue); font-weight: 600; }

/* ─── GRID ─── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(228px, 1fr));
  gap: 10px;
}

/* ─── CARD ─── */
.card {
  background: var(--white);
  border: 1px solid var(--bd);
  border-radius: 10px;
  padding: 18px;
  transition: border-color 0.15s, box-shadow 0.15s;
  animation: up 0.18s ease both;
  position: relative;
  overflow: hidden;
}
.card:hover {
  border-color: var(--bd2);
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}

.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; bottom: 0;
  width: 3px;
  border-radius: 10px 0 0 10px;
}
.card[data-s*="기계"]::before   { background: #6355C7; }
.card[data-s*="전기"]::before   { background: #D47B18; }
.card[data-s*="전자"]::before   { background: #2B72C8; }
.card[data-s*="금속"]::before   { background: #5A8A72; }
.card[data-s*="조리"]::before   { background: #CC5E30; }
.card[data-s*="영어"]::before   { background: #28A06A; }
.card[data-s*="수학"]::before   { background: #B8528A; }
.card[data-s*="체육"]::before   { background: #409A40; }
.card[data-s*="국어"]::before   { background: #8A62BE; }
.card[data-s*="역사"]::before   { background: #9A722A; }
.card[data-s*="보건"]::before   { background: #C83A3A; }
.card[data-s*="상담"]::before,
.card[data-s*="진로"]::before   { background: #2292B8; }
.card[data-s*="교장"]::before,
.card[data-s*="교감"]::before   { background: #1A3A8A; }
.card[data-s*="음악"]::before   { background: #B85A8A; }
.card[data-s*="물리"]::before,
.card[data-s*="화학"]::before   { background: #4272AA; }

.card-top {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 13px;
}

.avatar {
  width: 42px; height: 42px;
  border-radius: 10px;
  background: var(--bg);
  border: 1px solid var(--bd);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px;
  font-weight: 700;
  color: var(--tm);
  flex-shrink: 0;
}

.name-block { flex: 1; }

.name {
  font-size: 17px;
  font-weight: 700;
  color: var(--tx);
  letter-spacing: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  line-height: 1.2;
}

.dup-badge {
  font-size: 9px;
  font-weight: 600;
  color: var(--blue);
  background: var(--blue-lt);
  border: 1px solid #C4D1F7;
  padding: 1px 5px;
  border-radius: 3px;
  letter-spacing: 0.03em;
}

.head-badge {
  display: block;
  margin-top: 3px;
  font-size: 10px;
  font-weight: 600;
  color: var(--blue);
  letter-spacing: 0.02em;
}

.info { display: flex; flex-direction: column; gap: 5px; }
.info-row { display: flex; align-items: flex-start; gap: 8px; }
.lbl {
  font-size: 10px;
  color: var(--td);
  min-width: 28px;
  flex-shrink: 0;
  padding-top: 2px;
  font-weight: 500;
  letter-spacing: 0.03em;
}
.val { font-size: 12.5px; color: var(--tm); line-height: 1.6; }
.val.subj { color: var(--tx); font-weight: 600; font-size: 12px; }
.val.floor {
  font-size: 11px;
  background: var(--bg);
  border: 1px solid var(--bd);
  border-radius: 4px;
  padding: 0 7px;
  color: var(--tm);
  line-height: 1.9;
}

.empty {
  grid-column: 1/-1;
  text-align: center;
  padding: 60px;
  color: var(--td);
  font-size: 14px;
}

mark {
  background: #FFF0A8;
  color: inherit;
  border-radius: 2px;
}

@keyframes up {
  from { opacity: 0; transform: translateY(5px); }
  to   { opacity: 1; transform: none; }
}

@media (max-width: 600px) {
  header, .search-wrap, .body { padding-left: 18px; padding-right: 18px; }
  .grid { grid-template-columns: 1fr 1fr; gap: 8px; }
}
@media (max-width: 380px) {
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>

const nameCount = {};
DB.forEach(t => { nameCount[t.n] = (nameCount[t.n]||0)+1; });
let Q="", F="";

function hl(txt, q) {
  if (!q || !txt) return txt||"";
  return txt.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), m=>`<mark>${m}</mark>`);
}
function allText(t) { return [t.n,t.s,t.d,t.f,t.r,t.c||"",t.tag||""].join(" "); }
function matches(t,q,f) {
  const a=allText(t);
  if(f&&!a.includes(f))return false;
  return !q||a.toLowerCase().includes(q);
}
function render() {
  const q=Q.trim().toLowerCase();
  const list=DB.filter(t=>matches(t,q,F));
  document.getElementById('cnt').textContent=list.length;
  const g=document.getElementById('grid');
  if(!list.length){g.innerHTML=`<div class="empty">"${Q||F}" 검색 결과 없음</div>`;return;}
  const isHead=r=>["부장","교장","교감"].includes(r);
  g.innerHTML=list.map((t,i)=>{
    const h=s=>hl(s,q);
    const dup=nameCount[t.n]>1?`<span class="dup-badge">${t.tag||""}</span>`:"";
    const hb=isHead(t.r)?`<span class="head-badge">${h(t.r)}</span>`:"";
    return `<div class="card" data-s="${t.s}" style="animation-delay:${Math.min(i,40)*10}ms">
      <div class="card-top">
        <div class="avatar">${t.n[0]}</div>
        <div class="name-block">
          <div class="name">${h(t.n)}${dup}</div>
          ${hb}
        </div>
      </div>
      <div class="info">
        ${t.s?`<div class="info-row"><span class="lbl">교과</span><span class="val subj">${h(t.s)}</span></div>`:""}
        ${t.d?`<div class="info-row"><span class="lbl">부서</span><span class="val">${h(t.d)}</span></div>`:""}
        ${t.r&&!isHead(t.r)?`<div class="info-row"><span class="lbl">역할</span><span class="val">${h(t.r)}</span></div>`:""}
        ${t.f?`<div class="info-row"><span class="lbl">위치</span><span class="val floor">${h(t.f)}</span></div>`:""}
        ${t.c?`<div class="info-row"><span class="lbl">학급</span><span class="val">${h(t.c)}</span></div>`:""}
      </div>
    </div>`;
  }).join('');
}
document.getElementById('si').addEventListener('input',e=>{Q=e.target.value;document.getElementById('clr').classList.toggle('on',Q.length>0);render();});
document.getElementById('clr').addEventListener('click',()=>{document.getElementById('si').value='';Q='';document.getElementById('clr').classList.remove('on');render();});
document.querySelectorAll('.fb').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.fb').forEach(x=>x.classList.remove('on'));b.classList.add('on');F=b.dataset.f;render();}));
render();
</script>
